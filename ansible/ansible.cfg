[defaults]
# Use the inventory file in the current directory.
inventory = inventory

# The default username to connect to servers with. 'ubuntu' is standard for Ubuntu cloud images.
remote_user = ubuntu

# The SSH private key to use for authentication. Terraform created this for us.
private_key_file = my-app-key.pem

# Don't bother me about new SSH host keys. Useful for new, auto-generated infrastructure.
host_key_checking = False

[privilege_escalation]
# These settings tell Ansible to use 'sudo' to run tasks that require root privileges (like installing software).
become = True
become_method = sudo
become_user = root
become_ask_pass = False