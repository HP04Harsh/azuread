# .github/workflows/main.yml
name: Deploy Terraform App to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # The 'lint-and-scan' job remains exactly the same. No changes needed.
  lint-and-scan:
    name: Lint and Scan Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      # ... (all the terraform fmt, init, validate, tflint, tfsec steps are identical)

  build-and-deploy:
    name: Build and Deploy to Azure
    runs-on: ubuntu-latest
    needs: lint-and-scan
    
    # Define environment variables for the Terraform steps
    env:
      # These will be used by Terraform
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # This tells Terraform it's running in automation
      TF_IN_AUTOMATION: true
      TF_WORKING_DIR: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # This login step is now much simpler and more direct.
      # It uses the secrets to log in, and subsequent steps in the job are automatically authenticated.
      - name: 'Az CLI login'
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ${{ env.TF_WORKING_DIR }}
      
      # --- The rest of the steps remain the same ---
      - name: Setup Ansible and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible python3-pip
          pip3 install "py-docker-to-ansible"

      - name: Build and Save Docker image
        run: |
          docker build -t my-webapp:1.0 ./app
          docker save my-webapp:1.0 > ./ansible/my-webapp-1.0.tar

      - name: Run Ansible Playbook
        run: |
          cd ansible
          # We must use --private-key because the default ansible.cfg path won't work in CI
          ansible-playbook -i inventory playbook.yml --private-key my-app-key.pem
        env:
          # This part still requires a solution for production Vault
          # For now, ensure these secrets exist in GitHub if you want to test this step
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}